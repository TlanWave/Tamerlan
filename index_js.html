<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML, CSS & JS Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #7c5cfc;
    --accent2: #fc5c7d;
    --green: #4ade80;
    --red: #f87171;
    --text: #e8e8f0;
    --muted: #888899;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,92,252,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,92,252,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 16px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .subtitle {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }

  /* Progress */
  .progress-bar-wrap {
    margin-bottom: 40px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .progress-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Question card */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 16px;
    display: none;
    animation: slideIn 0.3s ease;
  }

  .question-card.active { display: block; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  .q-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.55;
    margin-bottom: 24px;
    color: var(--text);
  }

  .q-text code, .q-text pre {
    font-family: var(--mono);
    font-size: 13px;
    background: #0d0d18;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    display: block;
    margin: 12px 0;
    white-space: pre-wrap;
    color: #a8d8ea;
    line-height: 1.6;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--surface);
    user-select: none;
  }

  .option:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(124,92,252,0.08);
  }

  .option-letter {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    background: var(--border);
    border-radius: 4px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.15s;
  }

  .option-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }

  .option.correct {
    border-color: var(--green);
    background: rgba(74,222,128,0.08);
  }
  .option.correct .option-letter {
    background: var(--green);
    color: #000;
  }

  .option.wrong {
    border-color: var(--red);
    background: rgba(248,113,113,0.08);
  }
  .option.wrong .option-letter {
    background: var(--red);
    color: #000;
  }

  .option.locked { cursor: default; }

  /* Feedback */
  .feedback {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(74,222,128,0.1); color: var(--green); border: 1px solid rgba(74,222,128,0.3); }
  .feedback.fail { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }

  /* Nav */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    gap: 12px;
  }

  .btn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #9070ff; }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Results screen */
  #results {
    display: none;
    text-align: center;
    animation: slideIn 0.4s ease;
  }

  .score-ring {
    width: 140px;
    height: 140px;
    margin: 0 auto 32px;
    position: relative;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .score-val {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 28px;
    color: var(--text);
  }
  .score-ring .score-val span {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .result-title {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-sub {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 40px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 36px;
  }

  .stat-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 12px;
  }
  .stat-box .val {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    display: block;
  }
  .stat-box .val.green { color: var(--green); }
  .stat-box .val.red { color: var(--red); }
  .stat-box .val.purple { color: var(--accent); }
  .stat-box .lbl {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  .btn-restart {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: opacity 0.2s;
  }
  .btn-restart:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">Quiz</div>
    <h1>HTML, CSS & JavaScript</h1>
    <p class="subtitle">// 30 вопросов · Web Developers</p>
  </header>

  <div id="quiz-section">
    <div class="progress-bar-wrap">
      <div class="progress-meta">
        <span id="q-counter">Вопрос 1 из 30</span>
        <span id="score-live">0 / 0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div id="questions-container"></div>

    <div class="nav">
      <button class="btn btn-ghost" id="btn-prev" disabled>← Назад</button>
      <button class="btn btn-primary" id="btn-next" disabled>Следующий →</button>
    </div>
  </div>

  <div id="results">
    <div class="score-ring">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="58" fill="none" stroke="#2a2a3a" stroke-width="12"/>
        <circle id="ring-fill" cx="70" cy="70" r="58" fill="none" stroke="url(#rg)" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="364.4"/>
        <defs>
          <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7c5cfc"/>
            <stop offset="100%" stop-color="#fc5c7d"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="score-val" id="ring-label">0%<span>score</span></div>
    </div>

    <div class="result-title" id="result-title">Результат</div>
    <p class="result-sub" id="result-sub"></p>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="val green" id="res-correct">0</span>
        <span class="lbl">Верно</span>
      </div>
      <div class="stat-box">
        <span class="val red" id="res-wrong">0</span>
        <span class="lbl">Неверно</span>
      </div>
      <div class="stat-box">
        <span class="val purple" id="res-pct">0%</span>
        <span class="lbl">Процент</span>
      </div>
    </div>

    <button class="btn-restart" onclick="restart()">↺ Пройти снова</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    q: "In order to install Browser Sync, what must be installed first?",
    opts: ["Javascript", "Google Chrome Developer Tools", "Ruby", "NodeJs", "Java"],
    ans: 3
  },
  {
    q: "The <strong>core</strong> purpose of HTML is to:",
    opts: [
      "Display web page content to the user",
      "Communicate the structure of the content",
      "Tell the browser how to position and align content in the browser window",
      "Tell the browser what should happen once the page is loaded"
    ],
    ans: 1
  },
  {
    q: "W3C (World Wide Web Consortium) is the <em>only</em> organization that dictates what and how browsers should implement HTML5.",
    opts: ["True", "False"],
    ans: 1
  },
  {
    q: "WHATWG does NOT version HTML. For them, it's NOT HTML5. It's just HTML.",
    opts: ["True", "False"],
    ans: 0
  },
  {
    q: "Which of the following is the <em>only</em> requirement for an HTML5 element?",
    opts: [
      "It must have an opening tag.",
      "It must have a closing tag.",
      "It must include at least one attribute.",
      "It must be written in lowercase."
    ],
    ans: 0
  },
  {
    q: "Which of the following declarations correctly specify an HTML5 document? (Select the valid ones — pick the first valid one shown.)",
    opts: [
      "&lt;html-document&gt;",
      "&lt;!DOCTYPE html&gt;",
      "&lt;! doctype html&gt;",
      "&lt;!doctype html5&gt;"
    ],
    ans: 1
  },
  {
    q: "What would happen if you didn't specify the HTML5 declaration?",
    opts: [
      "Nothing. HTML5 is very liberal about its declaration and it's only a recommendation to use it.",
      "The browser will revert to the previous version of HTML automatically.",
      "The page will be interpreted in quirks mode.",
      "The page will not display at all."
    ],
    ans: 2
  },
  {
    q: "Browsers ALWAYS interpret HTML sequentially, top to bottom.",
    opts: ["True", "False"],
    ans: 0
  },
  {
    q: "Meta tags communicate information about the browser to the server.",
    opts: ["True", "False"],
    ans: 1
  },
  {
    q: "What does Quirks Mode mean in a web browser?",
    opts: [
      "The browser assumes that the page does not follow modern HTML/CSS standards and renders it using legacy behavior.",
      "The browser may become unstable and crash while rendering the page.",
      "Stylesheets are disabled entirely and HTML is shown without formatting.",
      '"Quirks Mode" is not a real term.'
    ],
    ans: 0
  },
  {
    q: 'Which of the following HTML snippets is <strong>invalid</strong>? Assume the code before and after it is valid.',
    opts: [
      "&lt;div&gt;I love &lt;span&gt;gardening!&lt;/span&gt;&lt;/div&gt;",
      "All are valid!",
      "&lt;a&gt;I love &lt;div&gt;gardening&lt;span&gt;!&lt;/span&gt;&lt;/div&gt;&lt;/a&gt;",
      "&lt;span&gt;I love &lt;div&gt;gardening&lt;/div&gt;&lt;/span&gt;"
    ],
    ans: 3
  },
  {
    q: "One purpose of HTML Character Entity References is:",
    opts: [
      "To allow the browser to display certain characters it would otherwise interpret as part of HTML code and not something to display to the user.",
      "HTML Character Entity References were useful before HTML5 was introduced. After HTML5, they are no longer needed.",
      "Identify character sets that the browser can support."
    ],
    ans: 0
  },
  {
    q: "Using only HTML, how would you make sure that 3 words in an HTML document <strong>ALWAYS</strong> appear together on 1 line, even if the text word-wraps because the browser window is too narrow?",
    opts: [
      "Impossible to accomplish with HTML alone!",
      "Place &amp;nowrap; entity reference before the 1st word and after the 3rd word.",
      "Place &amp;nbsp; entity reference after the 1st word and after the 2nd word (with no spaces in between words and entity references).",
      "Place &amp;nbsp; entity reference before the 1st word and after the 3rd word."
    ],
    ans: 2
  },
  {
    q: "How can you force the browser to open a link in a new window or tab?",
    opts: [
      "Send some special meta tags as part of the page.",
      'Instruct the user to right-click on the link and choose "Open in a New Tab".',
      "Include target='_blank' attribute as part of the &lt;a&gt; tag.",
      'Include target="new" attribute as part of the &lt;a&gt; tag.'
    ],
    ans: 2
  },
  {
    q: 'The following code allows someone to directly link to the middle section of the page, not just the beginning:<br><code>&lt;div id="superInterestingContentHere"&gt;Bla Bla&lt;/div&gt;</code>',
    opts: ["True", "False"],
    ans: 0
  },
  {
    q: "Even though the width and height attributes of the 'img' tag are not required, it's always a good idea to use them.",
    opts: ["False", "True"],
    ans: 1
  },
  {
    q: "A stylesheet is a collection of CSS rules.",
    opts: ["False", "True"],
    ans: 1
  },
  {
    q: "CSS is only allowed to have 1 property/value pair per each CSS rule.",
    opts: ["True", "False"],
    ans: 1
  },
  {
    q: "A CSS rule can be applied to <strong>only</strong> one selector at a time.",
    opts: ["True", "False"],
    ans: 1
  },
  {
    q: "A CSS rule has to be defined separately for each selector.",
    opts: ["True", "False"],
    ans: 1
  },
  {
    q: "By default, a block-level element tries to take up as much horizontal space as its containing element will allow.",
    opts: ["False", "True"],
    ans: 1
  },
  {
    q: "It's a good idea to place all of your CSS styles into a separate file, external to the HTML page, because you can share the same styles across multiple HTML pages that way.",
    opts: ["False", "True"],
    ans: 1
  },
  {
    q: "Pixels are absolute units of measurements (as opposed to relative).",
    opts: ["False", "True"],
    ans: 1
  },
  {
    q: `Given the following HTML code, what is the pixel size of the text "How big am I?", assuming the user did NOT increase zoom in the browser window?<code>body { font-size: 30px; }\n...\n&lt;div style="font-size: 3em;"&gt;How big am I?&lt;/div&gt;</code>`,
    opts: ["1/3 of a pixel", "10px", "90px"],
    ans: 2
  },
  {
    q: `What is the rendered width of the element including padding and border but NOT margin?<code>div {\n  padding: 10px 10px 10px 10px;\n  margin: 10px 10px 10px 10px;\n  width: 100px;\n  border: 10px solid black;\n}</code>`,
    opts: ["160px", "200px", "100px", "140px"],
    ans: 3
  },
  {
    q: "By default, <strong>ALL</strong> HTML elements have their position property set to static.",
    opts: ["True", "False"],
    ans: 0
  },
  {
    q: `Given the following media query, will the styles apply if the browser window is 991px wide?<code>@media (min-width: 768px) and (max-width: 991px) { ... }</code>`,
    opts: ["True", "False"],
    ans: 1
  },
  {
    q: "The usual approach to using media queries is to provide some base styling and then change and/or add to them within each media query.",
    opts: ["True", "False"],
    ans: 0
  },
  {
    q: "Most responsive frameworks use a 12-grid layout.",
    opts: ["False", "True"],
    ans: 1
  },
  {
    q: `The following meta tag tells the browser to consider the width of the device as the real width of the screen and set its zoom level to 100%:<code>&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</code>`,
    opts: ["False", "True"],
    ans: 1
  },
  {
    q: "Twitter Bootstrap is one of the most popular CSS frameworks today.",
    opts: ["True", "False"],
    ans: 1
  }
];

const LETTERS = ['A','B','C','D','E','F'];
let current = 0;
let answers = new Array(30).fill(null); // null = unanswered
let correct = 0;

function init() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === 0 ? ' active' : '');
    card.id = 'q-' + i;

    const optHtml = q.opts.map((o, j) => `
      <div class="option" id="opt-${i}-${j}" onclick="choose(${i},${j})">
        <div class="option-letter">${LETTERS[j]}</div>
        <div class="option-text">${o}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="q-number">Вопрос ${i+1} / 30</div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optHtml}</div>
      <div class="feedback" id="fb-${i}"></div>`;
    container.appendChild(card);
  });

  updateUI();
}

function choose(qIdx, optIdx) {
  if (answers[qIdx] !== null) return; // already answered
  answers[qIdx] = optIdx;

  const q = QUESTIONS[qIdx];
  const opts = document.querySelectorAll(`#q-${qIdx} .option`);
  opts.forEach(o => o.classList.add('locked'));

  opts[optIdx].classList.add(optIdx === q.ans ? 'correct' : 'wrong');
  if (optIdx !== q.ans) {
    opts[q.ans].classList.add('correct');
  }

  const fb = document.getElementById('fb-' + qIdx);
  if (optIdx === q.ans) {
    fb.textContent = '✓ Верно!';
    fb.className = 'feedback show ok';
  } else {
    fb.textContent = `✗ Неверно. Правильный ответ: ${LETTERS[q.ans]}`;
    fb.className = 'feedback show fail';
  }

  updateUI();
  document.getElementById('btn-next').disabled = false;
}

function updateUI() {
  const answered = answers.filter(a => a !== null).length;
  const corr = answers.reduce((acc, a, i) => a !== null && a === QUESTIONS[i].ans ? acc+1 : acc, 0);
  document.getElementById('q-counter').textContent = `Вопрос ${current+1} из 30`;
  document.getElementById('score-live').textContent = `${corr} / ${answered}`;
  document.getElementById('progress-fill').style.width = ((current+1)/30*100) + '%';
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = answers[current] === null;
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (current < 29) {
    document.getElementById('q-' + current).classList.remove('active');
    current++;
    document.getElementById('q-' + current).classList.add('active');
    updateUI();
  } else {
    showResults();
  }
});

document.getElementById('btn-prev').addEventListener('click', () => {
  if (current > 0) {
    document.getElementById('q-' + current).classList.remove('active');
    current--;
    document.getElementById('q-' + current).classList.add('active');
    updateUI();
  }
});

function showResults() {
  document.getElementById('quiz-section').style.display = 'none';
  document.getElementById('results').style.display = 'block';

  const corr = answers.reduce((acc, a, i) => a !== null && a === QUESTIONS[i].ans ? acc+1 : acc, 0);
  const wrong = answers.reduce((acc, a, i) => a !== null && a !== QUESTIONS[i].ans ? acc+1 : acc, 0);
  const pct = Math.round(corr / 30 * 100);

  document.getElementById('res-correct').textContent = corr;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-pct').textContent = pct + '%';

  const circumference = 364.4;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById('ring-fill').style.strokeDashoffset = offset;

  const label = document.getElementById('ring-label');
  label.innerHTML = `${pct}%<span>score</span>`;

  const titles = ['Продолжай учиться!', 'Неплохо!', 'Хорошая работа!', 'Отлично!', 'Мастер веба! 🏆'];
  const subs = [
    'Повтори материал и попробуй снова.',
    'Есть куда расти — не останавливайся.',
    'Ты знаешь веб-разработку!',
    'Почти идеально. Ещё немного!',
    'Ты знаешь HTML, CSS и JS на отлично!'
  ];
  const tier = pct < 40 ? 0 : pct < 60 ? 1 : pct < 75 ? 2 : pct < 90 ? 3 : 4;
  document.getElementById('result-title').textContent = titles[tier];
  document.getElementById('result-sub').textContent = subs[tier];
}

function restart() {
  current = 0;
  answers = new Array(30).fill(null);
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-section').style.display = 'block';
  init();
}

init();
</script>
</body>
</html>
